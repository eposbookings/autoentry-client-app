name: Sync code to 20i VPS

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Git branch to sync to the VPS"
        required: true
        default: "main"
      react_app_backend_url:
        description: "Public backend origin compiled into the React app"
        required: true
        default: "https://eposbookings.net"
      rebuild_backend:
        description: "Rebuild and restart the API container after syncing code"
        required: true
        type: boolean
        default: true

concurrency:
  group: sync-vps-code
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend on GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install frontend dependencies
        working-directory: Client App/frontend
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build frontend
        working-directory: Client App/frontend
        env:
          REACT_APP_BACKEND_URL: ${{ inputs.react_app_backend_url }}
        run: pnpm run build

      - name: Package frontend build
        run: |
          tar -C "Client App/frontend/build" -czf frontend-build.tar.gz .
          ls -lh frontend-build.tar.gz

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          if-no-files-found: error

  build-api:
    name: Build API image on GitHub
    runs-on: ubuntu-latest
    if: ${{ inputs.rebuild_backend }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Build API Docker image
        run: docker build -t autoentry-client-app-api:latest "./Client App/backend"

      - name: Save API Docker image
        run: |
          docker save autoentry-client-app-api:latest | gzip -1 > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Upload API image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar.gz
          if-no-files-found: error

  deploy:
    name: Sync code and deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-api
    if: ${{ always() && needs.build-frontend.result == 'success' && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deploy-files

      - name: Download API image artifact
        if: ${{ inputs.rebuild_backend }}
        uses: actions/download-artifact@v4
        with:
          name: api-image
          path: deploy-files

      - name: Show deploy bundle sizes
        run: ls -lh deploy-files

      - name: Copy deploy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy-files/*"
          target: "/tmp/autoentry-client-app-deploy"
          rm: true
          strip_components: 1

      - name: Sync code and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 35m
          script: |
            set -e
            cd /opt/autoentry-client-app

            DEPLOY_BRANCH="${{ inputs.deploy_branch }}"
            DEPLOY_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_ROOT="$HOME/autoentry-deploy-backups/$DEPLOY_TIMESTAMP"
            LEGACY_UPLOADS="/opt/autoentry-client-app/backend/uploads"
            CURRENT_UPLOADS="/opt/autoentry-client-app/Client App/backend/uploads"

            if [ -d "$LEGACY_UPLOADS" ] && [ "${{ inputs.rebuild_backend }}" != "true" ]; then
              echo "The legacy application layout is present. Re-run this deployment with rebuild_backend enabled."
              exit 1
            fi

            echo "Creating pre-deployment backup: $BACKUP_ROOT"
            umask 077
            mkdir -p "$BACKUP_ROOT"

            MYSQL_CONTAINER="$(docker compose ps -q mysql)"
            if [ -z "$MYSQL_CONTAINER" ]; then
              echo "MySQL container is not running; refusing to deploy without a database backup."
              exit 1
            fi

            docker compose exec -T mysql sh -c \
              'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --quick --routines --triggers "$MYSQL_DATABASE"' \
              > "$BACKUP_ROOT/mysql.sql"
            test -s "$BACKUP_ROOT/mysql.sql"

            if [ -d "$LEGACY_UPLOADS" ]; then
              mkdir -p "$BACKUP_ROOT/legacy-uploads"
              cp -a "$LEGACY_UPLOADS/." "$BACKUP_ROOT/legacy-uploads/"
            fi

            if [ -d "$CURRENT_UPLOADS" ]; then
              mkdir -p "$BACKUP_ROOT/current-uploads"
              cp -a "$CURRENT_UPLOADS/." "$BACKUP_ROOT/current-uploads/"
            fi

            {
              echo "branch=$DEPLOY_BRANCH"
              echo "commit_before=$(git rev-parse HEAD)"
              echo "created_utc=$DEPLOY_TIMESTAMP"
              echo "legacy_upload_files=$(find "$LEGACY_UPLOADS" -type f 2>/dev/null | wc -l)"
              echo "current_upload_files=$(find "$CURRENT_UPLOADS" -type f 2>/dev/null | wc -l)"
            } > "$BACKUP_ROOT/manifest.txt"

            echo "Syncing branch: $DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "Preparing persistent upload storage"
            mkdir -p "$CURRENT_UPLOADS"
            if [ -d "$BACKUP_ROOT/legacy-uploads" ]; then
              cp -an "$BACKUP_ROOT/legacy-uploads/." "$CURRENT_UPLOADS/"
            fi

            LEGACY_BACKUP_COUNT="$(find "$BACKUP_ROOT/legacy-uploads" -type f 2>/dev/null | wc -l)"
            CURRENT_UPLOAD_COUNT="$(find "$CURRENT_UPLOADS" -type f 2>/dev/null | wc -l)"
            if [ "$CURRENT_UPLOAD_COUNT" -lt "$LEGACY_BACKUP_COUNT" ]; then
              echo "Upload migration verification failed: expected at least $LEGACY_BACKUP_COUNT files, found $CURRENT_UPLOAD_COUNT."
              exit 1
            fi
            echo "Upload migration verified: $CURRENT_UPLOAD_COUNT files available in the current upload path."

            echo "Installing prebuilt frontend files"
            rm -rf "Client App/frontend/build"
            mkdir -p "Client App/frontend/build"
            tar -xzf /tmp/autoentry-client-app-deploy/frontend-build.tar.gz -C "Client App/frontend/build"

            echo "VPS is now on:"
            git log --oneline -1
            git status --short

            if [ "${{ inputs.rebuild_backend }}" = "true" ]; then
              echo "Loading prebuilt API image"
              ls -lh /tmp/autoentry-client-app-deploy/api-image.tar.gz
              echo "Disk before Docker load:"
              df -h
              echo "Docker storage before Docker load:"
              docker system df || true
              load_started="$(date +%s)"
              timeout 600 sh -c 'gzip -dc /tmp/autoentry-client-app-deploy/api-image.tar.gz | docker load'
              load_finished="$(date +%s)"
              echo "Docker image loaded in $((load_finished - load_started)) seconds"
              docker compose up -d --no-build api
            fi

            echo "Restarting lightweight web containers"
            docker compose up -d --force-recreate frontend nginx

            echo "Health check"
            # A first deployment can legitimately take several minutes while
            # additive schema upgrades are applied to existing live tables.
            # Do not mistake that migration window for an API crash.
            for attempt in $(seq 1 180); do
              if curl -fsS http://localhost:8000/api/health; then
                echo
                echo "API is healthy"
                exit 0
              fi
              API_CONTAINER="$(docker compose ps -q api)"
              if [ -z "$API_CONTAINER" ] || [ "$(docker inspect -f '{{.State.Running}}' "$API_CONTAINER" 2>/dev/null || echo false)" != "true" ]; then
                echo "API container stopped before becoming healthy. Recent logs:"
                docker compose logs --tail=160 api
                exit 1
              fi
              echo "API not ready yet ($attempt/180); schema upgrade or startup is still running..."
              if [ $((attempt % 12)) -eq 0 ]; then
                echo "Recent API startup progress:"
                docker compose logs --tail=20 api
              fi
              sleep 5
            done

            echo "API did not become healthy within 15 minutes. Recent logs:"
            docker compose logs --tail=200 api
            exit 1
