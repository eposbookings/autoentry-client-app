name: Sync code to 20i VPS

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Git branch to sync to the VPS"
        required: true
        default: "main"
      react_app_backend_url:
        description: "Public backend origin compiled into the React app"
        required: true
        default: "https://eposbookings.net"
      rebuild_backend:
        description: "Rebuild and restart the API container after syncing code"
        required: true
        type: boolean
        default: true
      reclaim_docker_space:
        description: "Reclaim old unused Docker images (keeps running images and the last 7 days for rollback)"
        required: true
        type: boolean
        default: false

concurrency:
  group: sync-vps-code
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve immutable release commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}
          fetch-depth: 1

      - name: Record release commit
        id: release
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend on GitHub
    runs-on: ubuntu-latest
    needs: resolve-release

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install frontend dependencies
        working-directory: Client App/frontend
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build frontend
        working-directory: Client App/frontend
        env:
          REACT_APP_BACKEND_URL: ${{ inputs.react_app_backend_url }}
        run: pnpm run build

      - name: Package frontend build
        run: |
          tar -C "Client App/frontend/build" -czf frontend-build.tar.gz .
          sha256sum frontend-build.tar.gz > frontend-build.tar.gz.sha256
          ls -lh frontend-build.tar.gz

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend-build.tar.gz
            frontend-build.tar.gz.sha256
          if-no-files-found: error

  build-api:
    name: Build backend images on GitHub
    runs-on: ubuntu-latest
    needs: resolve-release
    if: ${{ inputs.rebuild_backend }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Build API Docker image
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          docker build \
            --label "net.eposbookings.release.commit=$RELEASE_COMMIT" \
            -t "autoentry-client-app-api:$RELEASE_COMMIT" \
            "./Client App/backend"

      - name: Build payroll worker Docker image
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          docker build \
            --label "net.eposbookings.release.commit=$RELEASE_COMMIT" \
            -t "autoentry-client-app-payroll-worker:$RELEASE_COMMIT" \
            -f "./Payroll 2/Dockerfile.epos" \
            "./Payroll 2"

      - name: Save backend Docker images
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          docker save \
            "autoentry-client-app-api:$RELEASE_COMMIT" \
            "autoentry-client-app-payroll-worker:$RELEASE_COMMIT" \
            | gzip -1 > backend-images.tar.gz
          sha256sum backend-images.tar.gz > backend-images.tar.gz.sha256
          ls -lh backend-images.tar.gz

      - name: Upload backend images artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-images
          path: |
            backend-images.tar.gz
            backend-images.tar.gz.sha256
          if-no-files-found: error

  deploy:
    name: Sync code and deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-frontend
      - build-api
    if: ${{ always() && needs.build-frontend.result == 'success' && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deploy-files

      - name: Download backend images artifact
        if: ${{ inputs.rebuild_backend }}
        uses: actions/download-artifact@v4
        with:
          name: backend-images
          path: deploy-files

      - name: Add deployment script to bundle
        run: install -m 0755 .github/scripts/deploy-vps.sh deploy-files/deploy-vps.sh

      - name: Show deploy bundle sizes
        run: ls -lh deploy-files

      - name: Copy deploy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy-files/*"
          target: "/tmp/autoentry-client-app-deploy"
          rm: true
          strip_components: 1

      - name: Sync code and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: bash /tmp/autoentry-client-app-deploy/deploy-vps.sh '${{ inputs.deploy_branch }}' '${{ inputs.rebuild_backend }}' deploy '${{ inputs.reclaim_docker_space }}' '${{ needs.resolve-release.outputs.commit }}'
