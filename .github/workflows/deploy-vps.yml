name: Sync code to 20i VPS

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Git branch to sync to the VPS"
        required: true
        default: "main"
      react_app_backend_url:
        description: "Public backend origin compiled into the React app"
        required: true
        default: "https://eposbookings.net"
      rebuild_backend:
        description: "Rebuild and restart the API container after syncing code"
        required: true
        type: boolean
        default: true

concurrency:
  group: sync-vps-code
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend on GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install frontend dependencies
        working-directory: Client App/frontend
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build frontend
        working-directory: Client App/frontend
        env:
          REACT_APP_BACKEND_URL: ${{ inputs.react_app_backend_url }}
        run: pnpm run build

      - name: Package frontend build
        run: |
          tar -C "Client App/frontend/build" -czf frontend-build.tar.gz .
          ls -lh frontend-build.tar.gz

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          if-no-files-found: error

  build-api:
    name: Build API image on GitHub
    runs-on: ubuntu-latest
    if: ${{ inputs.rebuild_backend }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Build API Docker image
        run: docker build -t autoentry-client-app-api:latest "./Client App/backend"

      - name: Save API Docker image
        run: |
          docker save autoentry-client-app-api:latest | gzip -1 > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Upload API image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar.gz
          if-no-files-found: error

  deploy:
    name: Sync code and deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build-frontend
      - build-api
    if: ${{ always() && needs.build-frontend.result == 'success' && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deploy-files

      - name: Download API image artifact
        if: ${{ inputs.rebuild_backend }}
        uses: actions/download-artifact@v4
        with:
          name: api-image
          path: deploy-files

      - name: Add deployment script to bundle
        run: install -m 0755 .github/scripts/deploy-vps.sh deploy-files/deploy-vps.sh

      - name: Show deploy bundle sizes
        run: ls -lh deploy-files

      - name: Copy deploy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy-files/*"
          target: "/tmp/autoentry-client-app-deploy"
          rm: true
          strip_components: 1

      - name: Sync code and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: bash /tmp/autoentry-client-app-deploy/deploy-vps.sh '${{ inputs.deploy_branch }}' '${{ inputs.rebuild_backend }}'
